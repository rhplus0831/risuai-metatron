# One CI pipeline: util/ci/check.sh (docs/structure/build-test-platforms.md, "CI").
# Runs for pushes to `metatron` and `main` and for merge requests that target them.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(metatron|main)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(metatron|main)$/

# The Runner should mount /tmp as tmpfs ([runners.docker] tmpfs): the SQLite tests write their
# databases under os.tmpdir(), and on a disk-backed /tmp one of them runs past Vitest's 5 s timeout.
check:
  image: node:24
  interruptible: true
  variables:
    # The cache must sit under the project directory. Inside node_modules, Prettier, Vitest,
    # svelte-check, and the test inventory skip it.
    PNPM_STORE_DIR: $CI_PROJECT_DIR/node_modules/.pnpm-store
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    # onnxruntime-node's postinstall would download its CUDA providers on every job (.npmrc turns
    # the side-effects cache off, so the store cache does not keep them); CI runs on the CPU.
    ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/.pnpm-store/
  before_script:
    - corepack enable
  script:
    - bash util/ci/check.sh
